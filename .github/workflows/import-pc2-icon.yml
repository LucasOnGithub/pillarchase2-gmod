name: Import PC2 gamemode icon (one time)

on:
  push:
    paths:
      - .github/workflows/import-pc2-icon.yml

permissions:
  contents: write

jobs:
  import-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert the supplied PC2 wiki favicon
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          urls = [
              "https://static.wikia.nocookie.net/pc2/images/4/4a/Site-favicon.ico/revision/latest?cb=20260117201617",
              "https://static.wikia.nocookie.net/pc2/images/4/4a/Site-favicon.ico/revision/latest",
              "https://static.wikia.nocookie.net/pc2/images/4/4a/Site-favicon.ico",
          ]
          error = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; PC2GModIconImport/1.0)",
                      "Referer": "https://pc2.fandom.com/",
                  })
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read(1024 * 1024)
                  im = Image.open(io.BytesIO(data))
                  im.seek(getattr(im, "n_frames", 1) - 1)
                  im = im.convert("RGBA")
                  im.thumbnail((32, 32), Image.Resampling.LANCZOS)
                  if im.size != (32, 32):
                      canvas = Image.new("RGBA", (32, 32), (0, 0, 0, 0))
                      canvas.paste(im, ((32 - im.width) // 2, (32 - im.height) // 2))
                      im = canvas
                  out = Path("pillarchase2/gamemodes/pillarchase2/icon24.png")
                  out.parent.mkdir(parents=True, exist_ok=True)
                  im.save(out, "PNG")
                  print("Converted", url, "to", out, "size", out.stat().st_size)
                  break
              except Exception as exc:
                  error = exc
                  print("Fetch attempt failed:", type(exc).__name__, str(exc))
          else:
              raise RuntimeError("Could not retrieve the source favicon") from error
          PY

      - name: Commit icon and remove one-time importer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pillarchase2/gamemodes/pillarchase2/icon24.png
          git rm .github/workflows/import-pc2-icon.yml
          git commit -m "Add Pillar Chase 2 gamemode menu icon"
          git push
