name: Normalize Garry's Mod WAV audio

on:
  # Adding this workflow to main runs it immediately. Further incompatible
  # WAV imports are normalized by the same workflow on subsequent pushes.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-gmod-wav.yml'
      - 'pillarchase2/gamemodes/pillarchase2/content/sound/**/*.wav'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc2-wav-normalization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Convert unsupported WAV rates to 44.1 kHz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure ffmpeg and ffprobe are installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Convert only incompatible WAV files
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob nocaseglob

          sound_dir="pillarchase2/gamemodes/pillarchase2/content/sound"
          allowed='^(11025|22050|44100)$'
          converted=0
          checked=0

          echo "## Garry's Mod WAV validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Original sample rate | New sample rate |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"

          for wav in "$sound_dir"/**/*.wav; do
            [[ -f "$wav" ]] || continue
            checked=$((checked + 1))
            sample_rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$wav")"
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$wav")"

            if [[ "$sample_rate" =~ $allowed && "$codec" == "pcm_s16le" ]]; then
              echo "OK: $wav ($sample_rate Hz, PCM 16-bit)"
              continue
            fi

            echo "Converting: $wav ($sample_rate Hz, $codec) -> 44100 Hz pcm_s16le"
            temp_wav="$(mktemp --suffix=.wav)"
            trap 'rm -f "$temp_wav"' EXIT
            ffmpeg -hide_banner -loglevel error -nostdin -y \
              -i "$wav" -map 0:a:0 -vn -ar 44100 -c:a pcm_s16le -f wav "$temp_wav"

            result_rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$temp_wav")"
            result_codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$temp_wav")"
            if [[ "$result_rate" != "44100" || "$result_codec" != "pcm_s16le" ]]; then
              echo "::error file=$wav::Output is not 44100 Hz / 16-bit PCM WAV"
              exit 1
            fi

            mv -f "$temp_wav" "$wav"
            trap - EXIT
            echo "| `$wav` | $sample_rate Hz | 44100 Hz |" >> "$GITHUB_STEP_SUMMARY"
            converted=$((converted + 1))
          done

          # These two specific files prompted the fix; assert that they exist
          # and now have a supported rate, even if nothing needed changing.
          for filename in DarkFade.wav Fade1.wav; do
            target="$sound_dir/LobbyGUI/Sounds/$filename"
            if [[ ! -f "$target" ]]; then
              echo "::error file=$target::Required sound file does not exist"
              exit 1
            fi
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 "$target")"
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$target")"
            if [[ ! "$rate" =~ $allowed || "$codec" != "pcm_s16le" ]]; then
              echo "::error file=$target::Invalid sample rate or codec ($rate / $codec)"
              exit 1
            fi
            echo "Verified: $target at $rate Hz ($codec)"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked **$checked** WAVs; converted **$converted** incompatible WAVs." >> "$GITHUB_STEP_SUMMARY"
          echo "converted=$converted" >> "$GITHUB_OUTPUT"

      - name: Commit converted audio back to main
        if: steps.convert.outputs.converted != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'pillarchase2/gamemodes/pillarchase2/content/sound'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No WAV bytes changed; nothing to commit."
            exit 0
          fi
          git commit -m "Convert incompatible PC2 WAVs to 44.1 kHz PCM [skip ci]"
          git push origin HEAD:main
