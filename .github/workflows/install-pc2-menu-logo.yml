name: Install Pillar Chase 2 menu logo (one time)

on:
  push:
    paths:
      - .github/workflows/install-pc2-menu-logo.yml

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create correctly sized gamemode menu logo
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("pillarchase2/gamemodes/pillarchase2")
          source = root / "content/materials/StarterGui/LobbyGUI/ButtonFrames/BaseMenu/MenuFrame/BG/Logo.png"
          target = root / "logo.png"

          with Image.open(source) as original:
              if original.format != "PNG":
                  raise ValueError("Expected original PC2 logo to be PNG")
              original = original.convert("RGBA")
              # Game logo images should be 128px high, no more than 1024px wide.
              out_height = 128
              out_width = round(original.width * out_height / original.height)
              if out_width > 1024:
                  out_width = 1024
                  out_height = round(original.height * out_width / original.width)
              scaled = original.resize((out_width, out_height), Image.Resampling.LANCZOS)
              scaled.save(target, optimize=True)
              print("Original:", original.size, "Menu logo:", scaled.size, "File:", target)
          PY
      - name: Commit menu logo and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pillarchase2/gamemodes/pillarchase2/logo.png
          git rm .github/workflows/install-pc2-menu-logo.yml
          git commit -m "Add resized Pillar Chase 2 menu logo"
          git push
